{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">🏢 Add Company</h2>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Company Name</label>
                <input type="text" class="form-control" name="company_name" pattern="^[A-Za-z0-9][A-Za-z0-9 &.'\-]{1,99}$" maxlength="100" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Job Role</label>
                <input type="text" class="form-control" name="job_role" pattern="^[A-Za-z0-9][A-Za-z0-9 &/().,'\-]{1,99}$" maxlength="100" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Package (LPA)</label>
                <input type="text" class="form-control" name="package" pattern="^[0-9]+(\.[0-9]{1,2})?\s*(LPA|lpa)?$" maxlength="50">
            </div>

            <div class="mb-3">
                <label class="form-label">Eligibility CGPA</label>
                <input type="number" step="0.01" min="0" max="10" class="form-control" name="eligibility_cgpa">
            </div>

            <div class="mb-3">
                <label class="form-label">Required Skills</label>
                <textarea class="form-control" name="required_skills" pattern="^[A-Za-z0-9+#.,() /\-]{0,500}$" maxlength="500"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Location</label>
                <input type="text" class="form-control" name="location" pattern="^[A-Za-z0-9][A-Za-z0-9 ,.'/\-]{1,99}$" maxlength="100">
            </div>

            <div class="mb-3">
                <label class="form-label">Drive Date</label>
                <input type="date" class="form-control" name="drive_date">
            </div>

            <button type="submit" class="btn btn-success w-100">
                Add Company
            </button>

        </form>

    </div>

</div>

{% endblock %}
