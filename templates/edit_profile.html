<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">
        Edit Profile
    </h2>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text"
                   name="full_name"
                   class="form-control"
                   value="{{ student.full_name }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email"
                   name="email"
                   class="form-control"
                   value="{{ student.email }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text"
                   name="phone"
                   class="form-control"
                   value="{{ student.phone }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">CGPA</label>
            <input type="number"
                   step="0.01"
                   name="cgpa"
                   class="form-control"
                   value="{{ student.cgpa }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Skills</label>
            <textarea
                name="skills"
                class="form-control"
                rows="4">{{ student.skills }}</textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            Save Changes
        </button>

        <a href="{{ url_for('home') }}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
