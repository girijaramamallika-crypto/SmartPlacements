<!DOCTYPE html>
<html>
<head>
    <title>Available Placement Drives</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand">
            🎓 Placement Portal
        </span>
    </div>
</nav>

<div class="container mt-5">

    <h2 class="text-center mb-4">
        Available Placement Drives
    </h2>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

            <tr>
                <th>Company</th>
                <th>Drive Title</th>
                <th>Drive Date</th>
                <th>Last Date</th>
                <th>Venue</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody>

        {% for drive in drives %}

            <tr>

                <td>{{ drive.company.company_name }}</td>

                <td>{{ drive.drive_title }}</td>

                <td>{{ drive.drive_date }}</td>

                <td>{{ drive.last_date_to_apply }}</td>

                <td>{{ drive.venue }}</td>

                <td>
                    <a href="{{ url_for('apply_drive', drive_id=drive.drive_id) }}"
                       class="btn btn-success btn-sm">
                        Apply
                    </a>
                </td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
