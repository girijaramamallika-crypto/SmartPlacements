{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">✏️ Edit Company</h2>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Company Name</label>
                <input type="text"
                       class="form-control"
                       name="company_name"
                       pattern="^[A-Za-z0-9][A-Za-z0-9 &.'\-]{1,99}$"
                       maxlength="100"
                       value="{{ company.company_name }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Job Role</label>
                <input type="text"
                       class="form-control"
                       name="job_role"
                       pattern="^[A-Za-z0-9][A-Za-z0-9 &/().,'\-]{1,99}$"
                       maxlength="100"
                       value="{{ company.job_role }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Package</label>
                <input type="text"
                       class="form-control"
                       name="package"
                       value="{{ company.package }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Eligibility CGPA</label>
                <input type="number"
                       step="0.01"
                       class="form-control"
                       name="eligibility_cgpa"
                       min="0"
                       max="10"
                       value="{{ company.eligibility_cgpa }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Required Skills</label>
                <textarea class="form-control"
                          name="required_skills">{{ company.required_skills }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Location</label>
                <input type="text"
                       class="form-control"
                       name="location"
                       value="{{ company.location }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Drive Date</label>
                <input type="date"
                       class="form-control"
                       name="drive_date"
                       value="{{ company.drive_date }}">
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Update Company
            </button>

        </form>

    </div>

</div>

{% endblock %}
