{% extends "base.html" %}

{% block content %}

<div class="auth-shell auth-shell--wide">
    <div class="auth-card auth-card--wide">
        <div class="auth-header text-center mb-4">
            <div class="auth-icon">👨‍🎓</div>
            <h2>Student Registration</h2>
            <p>Create your profile for campus placements and recruiter opportunities.</p>
        </div>

        <form method="POST" class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" name="full_name" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Roll Number</label>
                <input type="text" class="form-control" name="roll_number" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Phone</label>
                <input type="text" class="form-control" name="phone">
            </div>

            <div class="col-md-6">
                <label class="form-label">Branch</label>
                <input type="text" class="form-control" name="branch">
            </div>

            <div class="col-md-6">
                <label class="form-label">CGPA</label>
                <input type="number" step="0.01" class="form-control" name="cgpa">
            </div>

            <div class="col-12">
                <label class="form-label">Skills</label>
                <input type="text" class="form-control" name="skills" placeholder="Python, Java, SQL, etc.">
            </div>

            <div class="col-12">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" required>
            </div>

            <div class="col-12">
                <button type="submit" class="btn btn-primary w-100 btn-lg">Register</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
